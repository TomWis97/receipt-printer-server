---
# ansible-playbook -i <inventory> ansible/playbook.example.yaml
- name: Receipt printer server
  hosts: receipt_printer
  become: true
  roles:
    - role: receipt_printer_server
      vars:
        # Your own templates, kept per host next to host_vars. Not under
        # host_vars itself: Ansible would load every template.yaml as variables.
        receipt_printer_server_templates_src: "{{ playbook_dir }}/host_files/{{ inventory_hostname }}/receipt-templates"
        receipt_printer_server_template_settings:
          shopping-receipt:
            payee: J. Jansen
            iban: NL91 ABNA 0417 1643 00
