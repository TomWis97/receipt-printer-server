---
# Where the code comes from. Both are git repositories, cloned on the target.
# They are public, so HTTPS needs no credentials on the target.
receipt_printer_server_repo: https://github.com/TomWis97/receipt-printer-server.git
receipt_printer_server_driver_repo: https://github.com/TomWis97/lib-epson-tm-t88v.git
receipt_printer_server_version: main
receipt_printer_server_driver_version: main

# git and a Python 3 with venv, and rsync for receipt_printer_server_templates_src.
# These are the AlmaLinux / EL names; Debian would need git and python3-venv.
receipt_printer_server_packages:
  - git-core
  - python3
  - rsync

# Open receipt_printer_server_port in firewalld. Set
# receipt_printer_server_firewalld_zone to use a zone other than the default.
receipt_printer_server_firewalld: true

receipt_printer_server_user: receipt-printer
receipt_printer_server_install_dir: /opt/receipt-printer-server
receipt_printer_server_config_dir: /etc/receipt-printer-server

receipt_printer_server_host: 0.0.0.0
# Below 1024, the unit grants the service CAP_NET_BIND_SERVICE for it.
receipt_printer_server_port: 80

# A directory of templates on the controller, mirrored to the target, removed
# templates included. Empty uses the example templates of the server repository.
receipt_printer_server_templates_src: ""

# The templates directory on the target.
receipt_printer_server_templates_dir: >-
  {{ receipt_printer_server_config_dir ~ '/templates'
     if receipt_printer_server_templates_src
     else receipt_printer_server_install_dir ~ '/src/server/templates' }}

receipt_printer_server_printer_device: /dev/usb/lp0
receipt_printer_server_printer_paper: 80mm
receipt_printer_server_printer_dry_run: false

# Settings per template, e.g.:
#   shopping-receipt:
#     payee: J. Jansen
#     iban: NL91 ABNA 0417 1643 00
receipt_printer_server_template_settings: {}
